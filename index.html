<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clean Green Night Vision</title>

  <style>
    body { margin: 0; overflow: hidden; background: black; }

    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
      /* Night vision color grading */
      filter: sepia(100%) hue-rotate(60deg) brightness(1.2) contrast(1.4);
    }

    video {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      /* Video is hidden because we draw it onto the canvas instead */
      visibility: hidden; 
    }

    canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }

    button {
      position: absolute;
      z-index: 100;
      bottom: 20px; left: 20px;
      padding: 12px;
      background: black;
      color: lime;
      border: 2px solid lime;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div id="container">
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas"></canvas>
</div>
<button id="switchBtn">SWITCH CAMERA</button>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let facingMode = "environment";
let pose, faceMesh;
let latestPose = null;
let latestFace = null;

async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode, width: { ideal: 1280 }, height: { ideal: 720 } }
  });
  video.srcObject = stream;
  return new Promise(resolve => {
    video.onloadeddata = () => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      resolve();
    };
  });
}

function initModels() {
  pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
  pose.setOptions({ modelComplexity: 1, minDetectionConfidence: 0.5 });
  pose.onResults(results => { latestPose = results.poseLandmarks; });

  faceMesh = new FaceMesh({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` });
  faceMesh.setOptions({ maxNumFaces: 1, minDetectionConfidence: 0.5 });
  faceMesh.onResults(results => { latestFace = results.multiFaceLandmarks; });
}

function drawFrame() {
  // 1. Clear the canvas
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 2. Draw the video background
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  // 3. Draw Skeleton if found
  if (latestPose) {
    const drawLine = (a, b) => {
      ctx.strokeStyle = "#00FF00";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(latestPose[a].x * canvas.width, latestPose[a].y * canvas.height);
      ctx.lineTo(latestPose[b].x * canvas.width, latestPose[b].y * canvas.height);
      ctx.stroke();
    };
    drawLine(11,12); drawLine(11,13); drawLine(13,15); drawLine(12,14); drawLine(14,16);
    drawLine(11,23); drawLine(12,24); drawLine(23,24); drawLine(23,25); drawLine(25,27);
    drawLine(24,26); drawLine(26,28);
  }

  // 4. Draw Face Mesh if found
  if (latestFace) {
    ctx.fillStyle = "#00FF00";
    for (const landmarks of latestFace) {
      landmarks.forEach(p => {
        ctx.fillRect(p.x * canvas.width, p.y * canvas.height, 2, 2);
      });
    }
  }

  requestAnimationFrame(drawFrame);
}

async function processVideo() {
  if (video.readyState >= 2) {
    await pose.send({ image: video });
    await faceMesh.send({ image: video });
  }
  setTimeout(processVideo, 30); // Run detection 30 times a second
}

document.getElementById("switchBtn").onclick = async () => {
  facingMode = facingMode === "environment" ? "user" : "environment";
  await startCamera();
};

async function start() {
  await startCamera();
  initModels();
  processVideo(); // Starts AI detection
  drawFrame();    // Starts visual rendering
}

start();
</script>
</body>
</html>
