<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exo Skeleton Stable</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
    }

    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: black;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
    }

    button {
      position: absolute;
      z-index: 10;
      bottom: 20px;
      left: 20px;
      padding: 12px 16px;
      font-size: 16px;
      background: white;
      border: none;
      border-radius: 8px;
    }
  </style>
</head>

<body>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>
<button id="switchBtn">Switch Camera</button>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let facingMode = "environment";
let camera;
let pose;

// 🦾 INIT POSE
function initPose() {
  pose = new Pose({
    locateFile: (file) =>
      `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
  });

  pose.setOptions({
    modelComplexity: 1,
    smoothLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });

  pose.onResults(drawResults);
}

// 🎯 DRAW
function drawResults(results) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  if (!results.poseLandmarks) return;

  const l = results.poseLandmarks;

  draw(11,12); draw(11,13); draw(13,15);
  draw(12,14); draw(14,16);
  draw(11,23); draw(12,24); draw(23,24);
  draw(23,25); draw(25,27);
  draw(24,26); draw(26,28);

  l.forEach(p => {
    ctx.fillStyle = "lime";
    ctx.beginPath();
    ctx.arc(p.x * canvas.width, p.y * canvas.height, 4, 0, Math.PI * 2);
    ctx.fill();
  });

  function draw(a, b) {
    ctx.strokeStyle = "lime";
    ctx.lineWidth = 3;

    ctx.beginPath();
    ctx.moveTo(l[a].x * canvas.width, l[a].y * canvas.height);
    ctx.lineTo(l[b].x * canvas.width, l[b].y * canvas.height);
    ctx.stroke();
  }
}

// 📷 CAMERA (IMPORTANT FIX: USE MEDIAPIPE CAMERA)
function startCamera() {
  camera = new Camera(video, {
    onFrame: async () => {
      await pose.send({ image: video });
    },
    width: 1280,
    height: 720,
    facingMode: facingMode
  });

  camera.start();
}

// 📏 CANVAS SETUP
function setupCanvas() {
  video.onloadedmetadata = () => {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
  };
}

// 🔄 SWITCH CAMERA
document.getElementById("switchBtn").onclick = () => {
  facingMode = facingMode === "environment" ? "user" : "environment";
  location.reload(); // simplest reliable switch on iPhone
};

// 🚀 START
async function start() {
  initPose();
  startCamera();
  setupCanvas();
}

start();
</script>

</body>
</html>
