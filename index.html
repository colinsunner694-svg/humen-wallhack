<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face Detector</title>

  <style>
    body { margin: 0; overflow: hidden; background: black; }
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
    }

    button {
      position: absolute;
      z-index: 10;
      bottom: 20px;
      left: 20px;
      padding: 12px 16px;
      font-size: 16px;
      background: white;
      border-radius: 8px;
      border: none;
    }
  </style>
</head>

<body>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>
<button id="switchBtn">Switch Camera</button>

<!-- MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
const videoElement = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let camera;
let facingMode = "environment";

// 📷 Setup camera
async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode }
  });

  videoElement.srcObject = stream;

  return new Promise(resolve => {
    videoElement.onloadedmetadata = () => {
      canvas.width = videoElement.videoWidth;
      canvas.height = videoElement.videoHeight;
      resolve();
    };
  });
}

// 🧠 Face detector (MediaPipe)
const faceDetection = new FaceDetection.FaceDetection({
  locateFile: (file) =>
    `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`
});

faceDetection.setOptions({
  model: "short",
  minDetectionConfidence: 0.5
});

faceDetection.onResults(onResults);

// 🎯 Draw results
function onResults(results) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);

  if (results.detections) {
    results.detections.forEach(det => {
      const box = det.boundingBox;

      const x = box.xCenter * canvas.width - (box.width * canvas.width / 2);
      const y = box.yCenter * canvas.height - (box.height * canvas.height / 2);
      const w = box.width * canvas.width;
      const h = box.height * canvas.height;

      ctx.strokeStyle = "lime";
      ctx.lineWidth = 3;
      ctx.strokeRect(x, y, w, h);

      ctx.fillStyle = "lime";
      ctx.font = "16px Arial";
      ctx.fillText("Face", x, y > 10 ? y - 5 : 10);
    });
  }
}

// 🔄 Camera switch
document.getElementById("switchBtn").onclick = async () => {
  facingMode = facingMode === "environment" ? "user" : "environment";
  await startCamera();
  startDetection();
};

// 🔁 Detection loop
function startDetection() {
  async function detect() {
    await faceDetection.send({ image: videoElement });
    requestAnimationFrame(detect);
  }
  detect();
}

// 🚀 Start everything
async function start() {
  await startCamera();
  startDetection();
}

start();
</script>

</body>
</html>
