<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Green Night Vision</title>
  <style>
    body { margin: 0; overflow: hidden; background: #001100; }

    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
      /* Night Vision Color Grade */
      filter: sepia(100%) hue-rotate(80deg) brightness(1.1) contrast(1.3) saturate(2);
    }

    video {
      position: absolute;
      visibility: hidden; /* We draw the video via Javascript for better control */
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
    }

    #ui-overlay {
      position: absolute;
      top: 20px;
      right: 20px;
      color: lime;
      font-family: 'Courier New', Courier, monospace;
      font-size: 12px;
      text-shadow: 0 0 5px lime;
      pointer-events: none;
    }

    button {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      padding: 15px 25px;
      background: rgba(0, 40, 0, 0.7);
      color: lime;
      border: 2px solid lime;
      border-radius: 30px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>

<div id="container">
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas"></canvas>
  <div id="ui-overlay">REC ● LIVE<br>ISO 800<br>30 FPS</div>
</div>

<button id="switchBtn">Switch Camera</button>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let facingMode = "environment";
let pose, faceMesh;
let currentPose = null;
let currentFace = null;

async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode, width: { ideal: 1280 }, height: { ideal: 720 } }
  });
  video.srcObject = stream;
  return new Promise(res => {
    video.onloadedmetadata = () => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      res();
    };
  });
}

function initAI() {
  pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
  pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5 });
  pose.onResults(res => { currentPose = res.poseLandmarks; });

  faceMesh = new FaceMesh({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` });
  faceMesh.setOptions({ maxNumFaces: 1, minDetectionConfidence: 0.5 });
  faceMesh.onResults(res => { currentFace = res.multiFaceLandmarks; });
}

// THE RENDER LOOP (Runs at 60fps)
function render() {
  // Clear the screen and draw the camera frame
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  // Draw Skeleton
  if (currentPose) {
    ctx.strokeStyle = "lime";
    ctx.lineWidth = 4;
    ctx.shadowBlur = 10;
    ctx.shadowColor = "lime";
    
    const connections = [
      [11,12], [11,13], [13,15], [12,14], [14,16],
      [11,23], [12,24], [23,24], [23,25], [25,27], [24,26], [26,28]
    ];

    connections.forEach(([a, b]) => {
      ctx.beginPath();
      ctx.moveTo(currentPose[a].x * canvas.width, currentPose[a].y * canvas.height);
      ctx.lineTo(currentPose[b].x * canvas.width, currentPose[b].y * canvas.height);
      ctx.stroke();
    });
  }

  // Draw Face Mesh
  if (currentFace) {
    ctx.fillStyle = "rgba(0, 255, 0, 0.5)";
    ctx.shadowBlur = 0;
    currentFace[0].forEach(p => {
      ctx.fillRect(p.x * canvas.width, p.y * canvas.height, 2, 2);
    });
  }

  requestAnimationFrame(render);
}

// THE AI PROCESSING LOOP (Runs as fast as the phone can think)
async function process() {
  if (video.readyState >= 2) {
    await pose.send({ image: video });
    await faceMesh.send({ image: video });
  }
  // Short delay to prevent crashing mobile browsers
  setTimeout(process, 10);
}

document.getElementById("switchBtn").onclick = async () => {
  facingMode = facingMode === "environment" ? "user" : "environment";
  await startCamera();
};

async function main() {
  await startCamera();
  initAI();
  process();
  render();
}

main();
</script>
</body>
</html>
