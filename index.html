<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face Detector</title>

  <style>
    body { margin: 0; overflow: hidden; background: black; }
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
    }

    button {
      position: absolute;
      z-index: 10;
      bottom: 20px;
      left: 20px;
      padding: 12px 16px;
      font-size: 16px;
      background: white;
      border-radius: 8px;
      border: none;
    }
  </style>
</head>

<body>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>
<button id="switchBtn">Switch Camera</button>

<!-- Face API -->
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let stream = null;
let facingMode = "environment";
let modelsReady = false;

// 📷 Camera
async function setupCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());

  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode }
  });

  video.srcObject = stream;

  return new Promise(resolve => {
    video.onloadedmetadata = () => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      resolve();
    };
  });
}

// 🧠 Load model (STABLE CDN)
async function loadModels() {
  await faceapi.nets.tinyFaceDetector.loadFromUri(
    "https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/weights"
  );

  modelsReady = true;
  console.log("Models loaded");
}

// 👁 Detect faces (IMPROVED SETTINGS)
async function detectFaces() {
  if (!modelsReady) {
    requestAnimationFrame(detectFaces);
    return;
  }

  const detections = await faceapi.detectAllFaces(
    video,
    new faceapi.TinyFaceDetectorOptions({
      inputSize: 416,   // 🔥 stronger detection
      scoreThreshold: 0.5
    })
  );

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(video, 0, 0);

  detections.forEach(det => {
    const { x, y, width, height } = det.box;

    ctx.strokeStyle = "lime";
    ctx.lineWidth = 3;
    ctx.strokeRect(x, y, width, height);

    ctx.fillStyle = "lime";
    ctx.font = "16px Arial";
    ctx.fillText("Face", x, y > 10 ? y - 5 : 10);
  });

  requestAnimationFrame(detectFaces);
}

// 🔄 Switch camera
document.getElementById("switchBtn").onclick = async () => {
  facingMode = facingMode === "environment" ? "user" : "environment";
  await setupCamera();
};

// 🚀 Start
async function start() {
  try {
    await loadModels();
    await setupCamera();
    detectFaces();
  } catch (err) {
    alert("Error: " + err.message);
    console.log(err);
  }
}

start();
</script>

</body>
</html>
