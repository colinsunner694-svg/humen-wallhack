<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exo Skeleton</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
    }

    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
    }

    button {
      position: absolute;
      z-index: 10;
      bottom: 20px;
      left: 20px;
      padding: 12px 16px;
      font-size: 16px;
      background: white;
      border: none;
      border-radius: 8px;
    }
  </style>
</head>

<body>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>
<button id="switchBtn">Switch Camera</button>

<!-- 🦾 MediaPipe Pose -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let facingMode = "environment";

// 📷 CAMERA
async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: {
      facingMode,
      width: { ideal: 1280 },
      height: { ideal: 720 }
    }
  });

  video.srcObject = stream;

  return new Promise(resolve => {
    video.onloadedmetadata = () => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      resolve();
    };
  });
}

// 🦾 POSE DETECTION
const pose = new Pose({
  locateFile: (file) =>
    `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
});

pose.setOptions({
  modelComplexity: 1,
  smoothLandmarks: true,
  enableSegmentation: false,
  minDetectionConfidence: 0.5,
  minTrackingConfidence: 0.5
});

pose.onResults(onResults);

function onResults(results) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  if (!results.poseLandmarks) return;

  const landmarks = results.poseLandmarks;

  // 🦴 Draw skeleton connections
  drawLine(landmarks, 11, 12); // shoulders
  drawLine(landmarks, 11, 13);
  drawLine(landmarks, 13, 15);

  drawLine(landmarks, 12, 14);
  drawLine(landmarks, 14, 16);

  drawLine(landmarks, 11, 23); // torso
  drawLine(landmarks, 12, 24);
  drawLine(landmarks, 23, 24);

  drawLine(landmarks, 23, 25); // legs
  drawLine(landmarks, 25, 27);
  drawLine(landmarks, 24, 26);
  drawLine(landmarks, 26, 28);

  // 🟢 joints
  landmarks.forEach(p => {
    ctx.fillStyle = "lime";
    ctx.beginPath();
    ctx.arc(p.x * canvas.width, p.y * canvas.height, 4, 0, 2 * Math.PI);
    ctx.fill();
  });
}

// 🔗 helper line function
function drawLine(landmarks, i1, i2) {
  const a = landmarks[i1];
  const b = landmarks[i2];

  ctx.strokeStyle = "lime";
  ctx.lineWidth = 3;

  ctx.beginPath();
  ctx.moveTo(a.x * canvas.width, a.y * canvas.height);
  ctx.lineTo(b.x * canvas.width, b.y * canvas.height);
  ctx.stroke();
}

// 🔁 loop
async function detectLoop() {
  await pose.send({ image: video });
  requestAnimationFrame(detectLoop);
}

// 🔄 switch camera
document.getElementById("switchBtn").onclick = async () => {
  facingMode = facingMode === "environment" ? "user" : "environment";
  await startCamera();
};

// 🚀 start
async function start() {
  await startCamera();
  detectLoop();
}

start();
</script>

</body>
</html>
