<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face Detector</title>

  <style>
    body { margin: 0; overflow: hidden; background: black; }

    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
    }

    button {
      position: absolute;
      z-index: 10;
      bottom: 20px;
      left: 20px;
      padding: 12px 16px;
      font-size: 16px;
      background: white;
      border: none;
      border-radius: 8px;
    }
  </style>
</head>

<body>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>
<button id="switchBtn">Switch Camera</button>

<!-- Face detector library (NO model downloads needed) -->
<script src="https://cdn.jsdelivr.net/npm/tracking/build/tracking-min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tracking/build/data/face-min.js"></script>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let stream = null;
let facingMode = "environment";

// 📷 Camera
async function startCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());

  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode }
  });

  video.srcObject = stream;

  return new Promise(resolve => {
    video.onloadedmetadata = () => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      resolve();
    };
  });
}

// 👁 Face tracking
function startDetection() {
  const tracker = new tracking.ObjectTracker("face");

  tracker.setInitialScale(4);
  tracker.setStepSize(2);
  tracker.setEdgesDensity(0.1);

  tracking.track(video, tracker);

  tracker.on("track", event => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(video, 0, 0);

    event.data.forEach(rect => {
      ctx.strokeStyle = "lime";
      ctx.lineWidth = 3;
      ctx.strokeRect(rect.x, rect.y, rect.width, rect.height);

      ctx.fillStyle = "lime";
      ctx.font = "16px Arial";
      ctx.fillText("Face", rect.x, rect.y > 10 ? rect.y - 5 : 10);
    });
  });
}

// 🔄 Switch camera
document.getElementById("switchBtn").onclick = async () => {
  facingMode = facingMode === "environment" ? "user" : "environment";
  await startCamera();
  startDetection();
};

// 🚀 Start
async function start() {
  await startCamera();
  startDetection();
}

start();
</script>

</body>
</html>
