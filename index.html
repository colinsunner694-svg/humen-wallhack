<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exo Skeleton Fixed</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
    }

    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: black;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
    }

    button {
      position: absolute;
      z-index: 10;
      bottom: 20px;
      left: 20px;
      padding: 12px 16px;
      font-size: 16px;
      background: white;
      border: none;
      border-radius: 8px;
    }
  </style>
</head>

<body>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>
<button id="switchBtn">Switch Camera</button>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let facingMode = "environment";
let pose;

// 📷 CAMERA (WAIT PROPERLY)
async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: {
      facingMode,
      width: { ideal: 1280 },
      height: { ideal: 720 }
    }
  });

  video.srcObject = stream;

  return new Promise(resolve => {
    video.onloadeddata = () => {   // 🔥 IMPORTANT FIX (not metadata)
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      resolve();
    };
  });
}

// 🦾 INIT POSE
function initPose() {
  pose = new Pose({
    locateFile: (file) =>
      `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
  });

  pose.setOptions({
    modelComplexity: 1,
    smoothLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });

  pose.onResults(onResults);
}

// 🎯 DRAW SKELETON
function onResults(results) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  if (!results.poseLandmarks) return;

  const l = results.poseLandmarks;

  draw(11,12); draw(11,13); draw(13,15);
  draw(12,14); draw(14,16);
  draw(11,23); draw(12,24); draw(23,24);
  draw(23,25); draw(25,27);
  draw(24,26); draw(26,28);

  l.forEach(p => {
    ctx.fillStyle = "lime";
    ctx.beginPath();
    ctx.arc(p.x * canvas.width, p.y * canvas.height, 4, 0, Math.PI * 2);
    ctx.fill();
  });

  function draw(a, b) {
    ctx.strokeStyle = "lime";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(l[a].x * canvas.width, l[a].y * canvas.height);
    ctx.lineTo(l[b].x * canvas.width, l[b].y * canvas.height);
    ctx.stroke();
  }
}

// 🔁 CONTROLLED LOOP (IMPORTANT FIX)
async function loop() {
  if (video.readyState >= 2) {
    await pose.send({ image: video });
  }
  requestAnimationFrame(loop);
}

// 🔄 SWITCH CAMERA
document.getElementById("switchBtn").onclick = async () => {
  facingMode = facingMode === "environment" ? "user" : "environment";
  await startCamera();
};

// 🚀 START
async function start() {
  await startCamera();
  initPose();
  loop();
}

start();
</script>

</body>
</html>
