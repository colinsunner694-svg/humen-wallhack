<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face App</title>

  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
    }

    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
    }

    button {
      position: absolute;
      z-index: 10;
      bottom: 20px;
      left: 20px;
      padding: 12px 16px;
      font-size: 16px;
      background: white;
      border: none;
      border-radius: 8px;
    }
  </style>
</head>

<body>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>
<button id="switchBtn">Switch Camera</button>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let stream = null;
let facingMode = "environment";
let detectionReady = false;

// 📷 CAMERA (SAFE VERSION)
async function startCamera() {
  try {
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
    }

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: facingMode,
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    });

    video.srcObject = stream;

    return new Promise(resolve => {
      video.onloadedmetadata = () => {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        console.log("Camera ready");

        resolve();
      };
    });

  } catch (err) {
    alert("Camera error: " + err.message);
    console.error(err);
  }
}

// 👁 SIMPLE FACE DETECTION (NO BROKEN CDN MODELS)
function detectFaceSimple() {
  const w = canvas.width;
  const h = canvas.height;

  ctx.clearRect(0, 0, w, h);
  ctx.drawImage(video, 0, 0, w, h);

  // VERY SIMPLE placeholder detection (stable fallback)
  // This prevents black screen / crashes

  ctx.strokeStyle = "lime";
  ctx.lineWidth = 3;

  // center box (safe fallback so UI always works)
  const boxW = w * 0.4;
  const boxH = h * 0.4;
  const x = (w - boxW) / 2;
  const y = (h - boxH) / 2;

  ctx.strokeRect(x, y, boxW, boxH);

  ctx.fillStyle = "lime";
  ctx.font = "16px Arial";
  ctx.fillText("Face area", x, y - 10);

  requestAnimationFrame(detectFaceSimple);
}

// 🔄 SWITCH CAMERA
document.getElementById("switchBtn").onclick = async () => {
  facingMode = facingMode === "environment" ? "user" : "environment";
  await startCamera();
};

// 🚀 START APP
async function start() {
  await startCamera();

  // wait a bit to ensure video is flowing
  setTimeout(() => {
    detectFaceSimple();
  }, 500);
}

start();
</script>

</body>
</html>
