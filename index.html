<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exo Skeleton</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
    }

    /* ✅ FIX ZOOM HERE */
    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: contain;   /* 🔥 THIS REMOVES ZOOM */
      background: black;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
    }

    button {
      position: absolute;
      z-index: 10;
      bottom: 20px;
      left: 20px;
      padding: 12px 16px;
      font-size: 16px;
      background: white;
      border: none;
      border-radius: 8px;
    }
  </style>
</head>

<body>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>
<button id="switchBtn">Switch Camera</button>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let facingMode = "environment";

// 📷 CAMERA
async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: {
      facingMode,
      width: { ideal: 1280 },
      height: { ideal: 720 }
    }
  });

  video.srcObject = stream;

  return new Promise(resolve => {
    video.onloadedmetadata = () => {

      // ✅ FIX: canvas matches real video
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      resolve();
    };
  });
}

// 🦾 POSE
const pose = new Pose({
  locateFile: (file) =>
    `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
});

pose.setOptions({
  modelComplexity: 1,
  smoothLandmarks: true,
  minDetectionConfidence: 0.5,
  minTrackingConfidence: 0.5
});

pose.onResults(onResults);

function onResults(results) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // draw video WITHOUT distortion
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  if (!results.poseLandmarks) return;

  const l = results.poseLandmarks;

  drawLine(l, 11, 12);
  drawLine(l, 11, 13);
  drawLine(l, 13, 15);
  drawLine(l, 12, 14);
  drawLine(l, 14, 16);
  drawLine(l, 11, 23);
  drawLine(l, 12, 24);
  drawLine(l, 23, 24);
  drawLine(l, 23, 25);
  drawLine(l, 25, 27);
  drawLine(l, 24, 26);
  drawLine(l, 26, 28);

  l.forEach(p => {
    ctx.fillStyle = "lime";
    ctx.beginPath();
    ctx.arc(p.x * canvas.width, p.y * canvas.height, 4, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawLine(l, a, b) {
  ctx.strokeStyle = "lime";
  ctx.lineWidth = 3;

  ctx.beginPath();
  ctx.moveTo(l[a].x * canvas.width, l[a].y * canvas.height);
  ctx.lineTo(l[b].x * canvas.width, l[b].y * canvas.height);
  ctx.stroke();
}

// 🔁 LOOP
async function loop() {
  await pose.send({ image: video });
  requestAnimationFrame(loop);
}

// 🔄 SWITCH CAMERA
document.getElementById("switchBtn").onclick = async () => {
  facingMode = facingMode === "environment" ? "user" : "environment";
  await startCamera();
};

// 🚀 START
async function start() {
  await startCamera();
  loop();
}

start();
</script>

</body>
</html>
